<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150">
<defs><style>text{font-family:Arial,sans-serif;fill:#d9f4ff}.t{font-size:34px;font-weight:bold}.h{font-size:19px;font-weight:bold}.n{font-size:15px}.s{font-size:13px}.state{fill:#082331;stroke:#39c5ff;stroke-width:3}.safe{fill:#0c3329;stroke:#4dd599;stroke-width:3}.alarm{fill:#351419;stroke:#ff6b6b;stroke-width:4}.line{stroke:#ffd166;stroke-width:3;fill:none;marker-end:url(#a)}.title{fill:#04121c;stroke:#39c5ff;stroke-width:3}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#ffd166"/></marker></defs>
<rect width="1800" height="1150" fill="#020b11"/><rect x="25" y="25" width="1750" height="1100" class="title"/><text x="55" y="75" class="t">PRANCHA 06 — SEQUÊNCIAS DE CONTROLE OBSERVADAS</text>
<text x="70" y="145" class="h">A — PREPARO DE LOTE DE NUTRIENTES</text>
<rect x="70" y="180" width="230" height="90" rx="12" class="state"/><text x="100" y="215" class="n">Desabilitar correção pH</text><text x="100" y="240" class="s">acionamento manual “Dose”</text><path d="M300 225H350" class="line"/>
<rect x="350" y="180" width="230" height="90" rx="12" class="state"/><text x="385" y="215" class="n">Encher até volume do lote</text><text x="385" y="240" class="s">se nível atual &lt; alvo</text><path d="M580 225H630" class="line"/>
<rect x="630" y="180" width="230" height="90" rx="12" class="state"/><text x="670" y="215" class="n">Ligar mistura + stirrers</text><text x="670" y="240" class="s">esperar 5 s</text><path d="M860 225H910" class="line"/>
<rect x="910" y="180" width="320" height="90" rx="12" class="state"/><text x="945" y="212" class="n">CalMag → 60 s → Micro → 60 s</text><text x="945" y="240" class="n">Bloom → 60 s → Grow</text><path d="M1230 225H1280" class="line"/>
<rect x="1280" y="180" width="420" height="90" rx="12" class="safe"/><text x="1315" y="212" class="n">Diluir com RO até EC alvo ou volume máx.−5 L</text><text x="1315" y="240" class="s">timeout observado: 8 min; reabilitar pH</text>
<text x="70" y="350" class="h">B — CORREÇÃO DE pH POR HISTERESE</text><rect x="70" y="390" width="280" height="105" rx="12" class="state"/><text x="105" y="427" class="n">A cada 1 min</text><text x="105" y="455" class="n">mistura ligada?</text><text x="105" y="480" class="s">se não: não dosar</text><path d="M350 442H420" class="line"/><rect x="420" y="390" width="360" height="105" rx="12" class="state"/><text x="455" y="425" class="n">pH ≥ alvo+0,1 → pH− 300 ms</text><text x="455" y="455" class="n">pH ≤ alvo−0,1 → pH+ 300 ms</text><text x="455" y="480" class="s">aprox. 1 mL pela tabela do autor</text><path d="M780 442H850" class="line"/><rect x="850" y="390" width="400" height="105" rx="12" class="safe"/><text x="885" y="425" class="n">Aguardar novo ciclo / nova leitura</text><text x="885" y="455" class="n">faixa morta: ±0,1 pH</text><text x="885" y="480" class="s">não é PID</text><path d="M1250 442H1320" class="line"/><rect x="1320" y="390" width="380" height="105" rx="12" class="alarm"/><text x="1355" y="425" class="n">Projeto novo: validar leitura,</text><text x="1355" y="455" class="n">mistura, limite diário e timeout</text><text x="1355" y="480" class="s">faltam na referência</text>
<text x="70" y="585" class="h">C — VAZAMENTO / INTERTRAVAMENTO</text><rect x="70" y="625" width="300" height="110" rx="12" class="alarm"/><text x="105" y="665" class="n">Qualquer sensor ≠ “Dry”</text><text x="105" y="695" class="n">ou leitura analógica ≤ 1000</text><text x="105" y="720" class="s">4 pontos na V1</text><path d="M370 680H440" class="line"/><rect x="440" y="625" width="360" height="110" rx="12" class="alarm"/><text x="475" y="660" class="n">Notificação crítica no telefone</text><text x="475" y="690" class="n">fechar entrada principal</text><text x="475" y="720" class="n">desligar automações/bombas CA</text><path d="M800 680H870" class="line"/><rect x="870" y="625" width="360" height="110" rx="12" class="state"/><text x="905" y="660" class="n">Inspeção e correção física</text><text x="905" y="690" class="n">reset manual no painel</text><text x="905" y="720" class="s">referência não força confirmação</text><path d="M1230 680H1300" class="line"/><rect x="1300" y="625" width="400" height="110" rx="12" class="safe"/><text x="1335" y="660" class="n">Projeto novo: reset com permissivos</text><text x="1335" y="690" class="n">sensores secos + teste de válvula</text><text x="1335" y="720" class="s">estado seguro local sem MQTT</text>
<text x="70" y="820" class="h">D — CLIMA / FERTIRRIGAÇÃO TEMPORIZADA</text><rect x="70" y="860" width="350" height="130" rx="12" class="state"/><text x="105" y="895" class="n">Umidade &lt; alvo−5 → ON</text><text x="105" y="925" class="n">Umidade &gt; alvo+5 → OFF</text><text x="105" y="955" class="s">histerese simples</text><rect x="500" y="860" width="390" height="130" rx="12" class="state"/><text x="535" y="895" class="n">Ambos T ≥ alvo+2 → fan alto</text><text x="535" y="925" class="n">Ambos T ≤ alvo−1 → fan baixo</text><text x="535" y="955" class="s">checagem a cada 30 s</text><rect x="970" y="860" width="350" height="130" rx="12" class="state"/><text x="1005" y="895" class="n">Até 5 horários/dia</text><text x="1005" y="925" class="n">duração 0,5–10 min</text><text x="1005" y="955" class="s">agenda Home Assistant</text><rect x="1400" y="860" width="300" height="130" rx="12" class="safe"/><text x="1435" y="895" class="n">Mistura: 5 min</text><text x="1435" y="925" class="n">a cada 20 min se &gt;10 L</text><text x="1435" y="955" class="s">código publicado</text>
<text x="70" y="1060" class="n" fill="#ffca6b">Linhas de melhoria mostram requisitos propostos; não devem ser atribuídas ao sistema observado.</text>
</svg>

