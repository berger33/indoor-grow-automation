<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <style>
      .bg{fill:#02090d}.frame{fill:none;stroke:#4ed7ff;stroke-width:2}.title{fill:#e8f8ff;font:700 30px monospace}.h{fill:#9eeaff;font:700 20px monospace}.n{fill:#d8edf4;font:17px monospace}.s{fill:#8db1bf;font:14px monospace}.ac{fill:none;stroke:#ffbd59;stroke-width:7}.dc{fill:none;stroke:#57e38d;stroke-width:6}.pe{fill:none;stroke:#5ad45a;stroke-width:4;stroke-dasharray:12 8}.sig{fill:none;stroke:#ba8cff;stroke-width:4}.box{fill:#071923;stroke:#4ed7ff;stroke-width:2}.warn{fill:#25150a;stroke:#ffbd59;stroke-width:2}.safe{fill:#072318;stroke:#57e38d;stroke-width:2}.bad{fill:#ff827a;font:700 18px monospace}.dim{fill:#ffcf7c;font:15px monospace}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#ffbd59"/></marker>
