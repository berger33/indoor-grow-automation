  <rect width="1800" height="1100" class="bg"/><rect x="25" y="25" width="1750" height="1050" class="frame"/>
  <text x="55" y="75" class="title">REV A — DIAGRAMA UNIFILAR • VARIANTE FIXA 127 V / 60 Hz</text>
  <text x="55" y="108" class="s">Cargas: exaustão • umidificação • fontes/SELV • iluminação fora do escopo • execução conforme projeto elétrico validado</text>

  <rect x="70" y="160" width="250" height="170" class="box"/><text x="100" y="202" class="h">ENTRADA DEDICADA</text><text x="100" y="240" class="n">127 V • L + N + PE</text><text x="100" y="270" class="n">corrente: HOLD</text><text x="100" y="300" class="s">cabo após memorial</text>
  <path d="M320 245H410" class="ac" marker-end="url(#a)"/><path d="M100 330V390H1660" class="pe"/>
  <rect x="410" y="160" width="190" height="170" class="box"/><text x="440" y="202" class="h">Q0</text><text x="440" y="238" class="n">Seccionadora 2P</text><text x="440" y="270" class="n">corrente: HOLD</text><text x="440" y="300" class="s">bloqueável</text>
  <path d="M600 245H690" class="ac" marker-end="url(#a)"/>
  <rect x="690" y="160" width="230" height="170" class="warn"/><text x="720" y="202" class="h">DPS1 • TIPO 2</text><text x="720" y="238" class="n">Uc/arranjo: HOLD</text><text x="720" y="270" class="n">depende TT / TN-S</text><text x="720" y="300" class="s">coordenação com concessionária</text>
