  <rect x="920" y="455" width="360" height="230" class="safe"/><text x="950" y="497" class="h">QF-C1 → PSU-C</text><text x="950" y="535" class="n">HDR-60-24</text><text x="950" y="575" class="n">127 VCA → 24 VCC / 2,5 A</text><text x="950" y="615" class="n">DDR-15G-5 → 5 VCC / 3 A</text><text x="950" y="650" class="s">fontes em trilho DIN</text>
  <rect x="1335" y="455" width="345" height="230" class="safe"/><text x="1365" y="497" class="h">PE / EQUIPOTENCIAL</text><text x="1365" y="535" class="n">gabinete • trilho • carcaças</text><text x="1365" y="575" class="n">PE dedicado</text><text x="1365" y="615" class="n">N nunca substitui PE</text><text x="1365" y="650" class="s">ensaio de continuidade obrigatório</text>

