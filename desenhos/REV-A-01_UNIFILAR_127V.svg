  <path d="M1435 760C1435 720 270 720 270 685" class="sig"/><path d="M1475 760C1475 735 700 735 700 685" class="sig"/>
  <text x="75" y="1040" class="bad">NÃO FABRICAR/ENERGIZAR: DPS, disjuntores, cabos, contatores e cargas ainda exigem dados de placa + revisão profissional.</text>
