<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#1565c0"/></marker>
    <style>
      .rack{stroke:#263238;stroke-width:7;fill:none}.shelf{stroke:#455a64;stroke-width:7}.dry{stroke:#ef6c00;stroke-width:3;fill:#fff3e0}
