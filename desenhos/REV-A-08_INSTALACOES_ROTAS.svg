<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950">
  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#1565c0"/></marker>
    <style>
      .rack{stroke:#263238;stroke-width:6;fill:#fafafa}.dryzone{stroke:#ef6c00;stroke-width:3;fill:#fff3e0}
      .wetzone{stroke:#0277bd;stroke-width:3;fill:#e1f5fe}.contain{stroke:#00695c;stroke-width:3;fill:#e0f2f1}
      .selv{stroke:#1565c0;stroke-width:5;fill:none;marker-end:url(#b)}.data{stroke:#6a1b9a;stroke-width:4;stroke-dasharray:10 6;fill:none}
      .tube{stroke:#00897b;stroke-width:5;fill:none;marker-end:url(#b)}.drain{stroke:#0277bd;stroke-width:7;stroke-dasharray:14 6;fill:none;marker-end:url(#b)}
      .ca{stroke:#d84315;stroke-width:5;fill:none}.barrier{stroke:#c62828;stroke-width:3;stroke-dasharray:8 5;fill:none}
      .txt{font:20px Arial,sans-serif;fill:#17202a}.small{font:15px Arial,sans-serif;fill:#37474f}
      .title{font:bold 29px Arial,sans-serif;fill:#102027}.hold{font:bold 18px Arial,sans-serif;fill:#c62828}
    </style>
  </defs>
  <rect width="1500" height="950" fill="white"/>
  <text x="55" y="48" class="title">REV-A-08 — PLANTA DE INSTALAÇÕES, ROTAS E SEGREGAÇÃO</text>
  <text x="55" y="78" class="hold">A0 / HOLD — VALIDAR RAIOS, COMPRIMENTOS, PRENSA-CABOS E ACESSO DE MANUTENÇÃO</text>

  <rect x="190" y="125" width="850" height="700" class="rack"/>
  <rect x="230" y="165" width="360" height="330" rx="10" class="dryzone"/>
  <text x="325" y="205" class="txt">ZONA SECA QD/QC</text>
  <rect x="650" y="165" width="340" height="330" rx="10" class="wetzone"/>
  <text x="735" y="205" class="txt">DOSAGEM C1…C6</text>
  <rect x="230" y="525" width="500" height="105" rx="10" class="wetzone"/>
  <text x="330" y="575" class="txt">TK-101 • 50 L • NÍVEL SUPERIOR</text>
  <rect x="215" y="638" width="530" height="18" rx="6" class="contain"/>
  <text x="250" y="680" class="small">CT2: bandeja coletora + dois drenos gravitacionais</text>
  <rect x="230" y="690" width="500" height="105" rx="10" class="contain"/>
  <text x="330" y="745" class="txt">TK-201 EM CT1 • NÍVEL INFERIOR</text>
  <rect x="780" y="525" width="210" height="270" rx="10" class="wetzone"/>
  <text x="850" y="560" class="small" transform="rotate(90 850 560)">PAINEL HIDRÁULICO LATERAL</text>
  <text x="910" y="550" class="small" transform="rotate(90 910 550)">BOMBAS • VÁLVULAS • UNIÕES</text>

  <path d="M245 145H575V250" class="ca"/><text x="250" y="132" class="small">CA somente em canaleta fechada superior esquerda</text>
  <path d="M270 230H550V455H1040" class="selv"/><text x="300" y="255" class="small">SELV 24/5 V</text>
  <path d="M270 285H520V470H1075" class="data"/><text x="300" y="310" class="small">dados/barramento</text>
  <path d="M615 125V825" class="barrier"/><text x="598" y="420" class="small" transform="rotate(-90 598 420)">BARREIRA SECO/MOLHADO</text>

  <path d="M700 265V500H805V610" class="tube"/>
  <path d="M785 265V480H825V610" class="tube"/>
  <path d="M870 265V460H845V610" class="tube"/>
  <path d="M700 425V440H865V610" class="tube"/>
  <path d="M785 425V590H885V610" class="tube"/>
  <path d="M870 425V570H905V610" class="tube"/>
  <text x="725" y="320" class="small">tubos presos a cada 150–200 mm</text>

  <path d="M930 650H1115V780H1040" class="drain"/><text x="1125" y="600" class="small">dreno/retorno</text>
  <path d="M250 575H145V760H230" class="tube"/><text x="65" y="625" class="small">sucção/transferência</text>
  <path d="M690 655H755V780H730" class="drain"/><path d="M650 655H770V760H730" class="drain"/>
  <text x="750" y="710" class="small">CT2 → CT1</text>

  <path d="M550 455c0 35 55 35 55 0" class="selv" marker-end="none"/><text x="430" y="520" class="small">laço de gotejamento antes do prensa-cabo</text>
  <circle cx="1040" cy="455" r="9" fill="#1565c0"/><circle cx="1075" cy="470" r="9" fill="#6a1b9a"/>
  <text x="1090" y="455" class="small">saída para clima</text><text x="1090" y="480" class="small">entrada em caixa ventilada SELV</text>

  <g fill="#263238">
    <circle cx="805" cy="610" r="6"/><circle cx="825" cy="610" r="6"/><circle cx="845" cy="610" r="6"/>
    <circle cx="865" cy="610" r="6"/><circle cx="885" cy="610" r="6"/><circle cx="905" cy="610" r="6"/>
  </g>
  <text x="790" y="820" class="small">U-301…306: uniões antes da injeção</text>

  <rect x="1120" y="155" width="320" height="350" fill="#fafafa" stroke="#263238" stroke-width="2"/>
  <text x="1220" y="195" class="txt">LEGENDA</text>
  <path d="M1150 235H1260" class="ca"/><text x="1280" y="242" class="small">127 V / PE</text>
  <path d="M1150 285H1260" class="selv"/><text x="1280" y="292" class="small">SELV</text>
  <path d="M1150 335H1260" class="data"/><text x="1280" y="342" class="small">dados</text>
  <path d="M1150 385H1260" class="tube"/><text x="1280" y="392" class="small">processo</text>
  <path d="M1150 435H1260" class="drain"/><text x="1280" y="442" class="small">dreno</text>
  <path d="M1150 480H1260" class="barrier"/><text x="1280" y="487" class="small">barreira</text>

  <rect x="55" y="875" width="1390" height="48" fill="none" stroke="#263238" stroke-width="2"/>
  <text x="70" y="905" class="small">Critério: TK-101 sobre TK-201 sem contato; nenhuma linha molhada sobre QD/QC; CT2 drena a CT1; rotas identificadas.</text>
  <text x="1335" y="905" class="small">08/08</text>
</svg>
