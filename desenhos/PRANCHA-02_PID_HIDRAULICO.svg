<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
<defs><style>text{font-family:Arial,sans-serif;fill:#d8f3ff}.t{font-size:34px;font-weight:bold}.h{font-size:20px;font-weight:bold}.n{font-size:16px}.s{font-size:13px}.tk{fill:#081d2b;stroke:#45c7ff;stroke-width:3}.pipe{stroke:#4ab8ff;stroke-width:8;fill:none}.drain{stroke:#8dcef2;stroke-width:6;fill:none;stroke-dasharray:14 8}.signal{stroke:#ffd166;stroke-width:3;fill:none;stroke-dasharray:8 6}.inst{fill:#04121c;stroke:#ffd166;stroke-width:3}.valve{fill:#04121c;stroke:#ff9f43;stroke-width:4}.warn{fill:#ffca6b}.title{fill:#04121c;stroke:#39c5ff;stroke-width:3}</style><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#4ab8ff"/></marker><marker id="d" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#8dcef2"/></marker></defs>
<rect width="1800" height="1100" fill="#020b11"/><rect x="25" y="25" width="1750" height="1050" class="title"/><text x="55" y="75" class="t">PRANCHA 02 — P&amp;ID HIDRÁULICO DE REFERÊNCIA</text><text x="55" y="105" class="s">Linhas azuis: água/solução • tracejado azul: retorno/dreno • amarelo: sinal de controle</text>
<text x="70" y="190" class="h">REDE DE OSMOSE REVERSA</text><path d="M70 230H240" class="pipe" marker-end="url(#b)"/><polygon points="250,210 285,230 250,250" class="valve"/><polygon points="320,210 285,230 320,250" class="valve"/><text x="245" y="280" class="n">XV-001 • corte geral</text><text x="235" y="302" class="s">válvula NO; energizar = fechar</text>
