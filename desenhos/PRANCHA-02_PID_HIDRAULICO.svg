<path d="M400 390H250V710" class="pipe"/><rect x="90" y="710" width="320" height="210" rx="8" class="tk"/><text x="120" y="750" class="h">HUM-101 • UMIDIFICADOR DIY</text><text x="120" y="785" class="n">boia + 2 discos ultrassônicos</text><text x="120" y="815" class="n">ventilador de computador</text><text x="120" y="845" class="s">alimentação por gravidade de TK-101</text>
<path d="M285 210V135H1520V300" class="signal"/><text x="1030" y="130" class="s">intertravamento de vazamento fecha XV-001 e desliga bombas</text><text x="70" y="1030" class="warn n">CRÍTICO: dimensionar transbordo, válvula antirretorno, retenção de sifão e drenos ≥ 1/2 in; o vídeo relata obstrução com drenos de 1/4 in.</text>
