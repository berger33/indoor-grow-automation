  <rect x="585" y="465" width="230" height="250" rx="8" fill="#102f49" stroke="#58b9ff" stroke-width="2"/><text x="620" y="510" class="h">ESP32 38P</text><text x="620" y="550" class="n">8 outputs</text><text x="620" y="585" class="n">I²C / 1-Wire</text><text x="620" y="620" class="n">flow / alarm</text><text x="620" y="665" class="s">soquetes 2 × 19</text>
