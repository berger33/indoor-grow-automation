  <text x="180" y="205" class="dim">160,0 mm</text><text x="55" y="550" class="dim" transform="rotate(-90 55 550)">100,0 mm</text>
  <circle cx="135" cy="205" r="18" class="keep"/><circle cx="1185" cy="205" r="18" class="keep"/><circle cx="135" cy="835" r="18" class="keep"/><circle cx="1185" cy="835" r="18" class="keep"/>

