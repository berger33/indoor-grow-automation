  <rect x="100" y="920" width="1600" height="100" class="keep"/><text x="130" y="960" class="bad">GATE DE FABRICAÇÃO: esquema KiCad + ERC + DRC + fit-check + protótipo A0 + teste térmico 24 h + HIL.</text><text x="130" y="993" class="n">Sem esses passos não gerar Gerber, não comprar lote e não declarar risco residual aceitável.</text>
