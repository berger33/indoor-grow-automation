<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#1565c0"/></marker>
    <style>
      .frame{stroke:#263238;stroke-width:5;fill:none}.tank{stroke:#0277bd;stroke-width:3;fill:#e1f5fe}
      .tray{stroke:#00695c;stroke-width:3;fill:#e0f2f1}.dry{stroke:#ef6c00;stroke-width:3;fill:#fff3e0}
      .service{stroke:#43a047;stroke-width:2;stroke-dasharray:12 8;fill:#e8f5e9;fill-opacity:.5}
      .dim{stroke:#1565c0;stroke-width:2;marker-start:url(#a);marker-end:url(#a)}
      .line{stroke:#546e7a;stroke-width:2;fill:none}.txt{font-family:Arial,sans-serif;font-size:21px;fill:#17202a}
      .small{font-family:Arial,sans-serif;font-size:17px;fill:#37474f}.title{font:bold 30px Arial,sans-serif;fill:#102027}
      .hold{font:bold 18px Arial,sans-serif;fill:#c62828}
    </style>
  </defs>
  <rect width="1400" height="900" fill="#fff"/>
  <text x="60" y="55" class="title">REV-A-04 — PLANTA BAIXA DO RACK E CONTENÇÃO</text>
  <text x="60" y="86" class="hold">A0 / HOLD — ENVELOPES MÁXIMOS; MEDIR OS DOIS RESERVATÓRIOS ANTES DA COMPRA</text>

  <rect x="300" y="180" width="585" height="390" class="frame"/>
  <text x="485" y="165" class="txt">RACK 900 × 600</text>
  <rect x="335" y="215" width="515" height="320" rx="12" class="tray"/>
  <text x="415" y="250" class="small">CT1: BACIA INFERIOR ≥ 110 L LIVRES</text>
  <rect x="400" y="295" width="385" height="200" rx="14" class="tank"/>
  <text x="507" y="376" class="txt">TK-201</text>
  <text x="492" y="408" class="small">mistura 50 L — NÍVEL INFERIOR</text>
  <rect x="385" y="280" width="415" height="230" rx="16" fill="none" stroke="#7e57c2" stroke-width="4" stroke-dasharray="11 7"/>
  <text x="430" y="530" class="small">tracejado: TK-101 / WIT-101 no nível superior</text>
  <text x="438" y="555" class="small">sólido: TK-201 / WIT-201 no nível inferior</text>

  <rect x="300" y="590" width="585" height="190" class="service"/>
  <text x="350" y="670" class="txt">EXTRAÇÃO FRONTAL POR NÍVEL ≥ 900</text>
  <text x="372" y="705" class="small">drenar antes de remover; nunca erguer tanque cheio</text>
  <path d="M592 495 V650" class="line" stroke-dasharray="10 7"/>
  <text x="910" y="330" class="small">LATERAL SECA</text>
  <rect x="900" y="350" width="140" height="100" class="dry"/>
  <text x="926" y="390" class="small">subida</text><text x="919" y="414" class="small">de cabos</text>
  <text x="150" y="330" class="small">LATERAL MOLHADA</text>
  <rect x="190" y="350" width="90" height="100" class="tank"/>
  <text x="202" y="390" class="small">tubos e</text><text x="209" y="414" class="small">dreno</text>

  <line x1="300" y1="130" x2="885" y2="130" class="dim"/>
  <text x="575" y="120" class="small">900</text>
  <line x1="240" y1="180" x2="240" y2="570" class="dim"/>
  <text x="185" y="385" class="small" transform="rotate(-90 185 385)">600</text>
  <line x1="400" y1="265" x2="785" y2="265" class="dim"/>
  <text x="565" y="258" class="small">≤ 700</text>
  <line x1="820" y1="295" x2="820" y2="495" class="dim"/>
  <text x="806" y="420" class="small" transform="rotate(-90 806 420)">≤ 450</text>

  <rect x="60" y="810" width="1280" height="60" fill="none" stroke="#263238" stroke-width="2"/>
  <text x="75" y="838" class="small">Planta sobreposta: os tanques compartilham o prumo, não a prateleira. Mangueiras não desviam carga.</text>
  <text x="75" y="861" class="small">Envelope A0 por tanque: ≤700 × 450 mm. Altura, tampa, CT1 e CT2 são verificadas na elevação. Unidades: mm.</text>
  <text x="1170" y="838" class="small">FOLHA 04/08</text>
</svg>
