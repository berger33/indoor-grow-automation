<rect x="90" y="905" width="1620" height="105" class="mod"/><text x="120" y="940" class="bad h">NÃO CONGELAR ESTA REVISÃO SEM ENSAIO</text><text x="120" y="972" class="n">O autor corrigiu a ordem TX/RX dos headers EZO e publicou uma versão modificada ainda não testada. A BOM também diverge entre 4,7 kΩ e 5 kΩ em R1/R5.</text><text x="120" y="998" class="s">Produzir protótipo de bancada, teste de continuidade, isolamento, PWM 0–10 V, optoacopladores e cada conector antes de encomendar lote.</text>
