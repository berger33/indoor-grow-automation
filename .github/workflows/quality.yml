name: Quality Gate

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install panel dependencies
        run: npm ci --prefix web

      - name: Install hub dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Install PlatformIO isolated
        run: pipx install platformio==6.1.19

      - name: Test Mosquitto TLS and ACL
        run: bash scripts/test_mosquitto_tls.sh

      - name: Validate ARM64 Compose structure
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config --quiet

      - name: Run quality gate
        run: python scripts/quality_gate.py
