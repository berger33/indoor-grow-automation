name: Regenerate SBOM once

on:
  push:
    branches:
      - maintenance/react-types-19.2.18

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Regenerate deterministic SBOM
        run: python scripts/generate_sbom.py

      - name: Commit generated SBOM and remove helper
        shell: bash
        run: |
          rm .github/workflows/regenerate-sbom-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sbom/indoor-grow.spdx.json .github/workflows/regenerate-sbom-once.yml
          git commit -m "chore(sbom): sync after React types update"
          git push origin HEAD:maintenance/react-types-19.2.18
