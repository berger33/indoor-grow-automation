<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Provisionamento seguro dos três ESP32</title><desc id="desc">Identificar, compilar, gravar e comprovar safe boot.</desc><rect width="1200" height="520" fill="#071411"/><text x="55" y="55" fill="#52e6a3" font-family="sans-serif" font-size="25" font-weight="700">ETAPA 09 · FERTIGATION · CLIMATE · SAFETY</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(60 110)"><rect width="250" height="290" rx="18" fill="#10261f" stroke="#1d3a31"/><text x="125" y="42" fill="#fff" font-size="21">1 · Identificar</text><rect x="55" y="90" width="140" height="135" rx="12" fill="#164c48" stroke="#62d9df" stroke-width="5"/><text x="125" y="165" fill="#52e6a3" font-size="18">NODE ID</text><text x="125" y="262" fill="#8eb0a4" font-size="17">placa e revisão</text></g><g transform="translate(340 110)"><rect width="250" height="290" rx="18" fill="#10261f" stroke="#1d3a31"/><text x="125" y="42" fill="#fff" font-size="21">2 · Compilar</text><text x="125" y="150" fill="#62d9df" font-size="62">&lt;/&gt;</text><path d="M65 205h120" stroke="#52e6a3" stroke-width="8"/><text x="125" y="262" fill="#8eb0a4" font-size="17">ambiente fixado</text></g><g transform="translate(620 110)"><rect width="250" height="290" rx="18" fill="#10261f" stroke="#1d3a31"/><text x="125" y="42" fill="#fff" font-size="21">3 · Gravar</text><path d="M125 85v105M90 155l35 35 35-35" fill="none" stroke="#ffc866" stroke-width="10"/><rect x="70" y="200" width="110" height="28" rx="8" fill="#62d9df"/><text x="125" y="262" fill="#8eb0a4" font-size="17">USB · sem atuador</text></g><g transform="translate(900 110)"><rect width="250" height="290" rx="18" fill="#10261f" stroke="#1d3a31"/><text x="125" y="42" fill="#fff" font-size="21">4 · Safe boot</text><path d="M58 175h134" stroke="#ff7a7a" stroke-width="14"/><circle cx="125" cy="175" r="48" fill="#071411" stroke="#52e6a3" stroke-width="8"/><text x="125" y="184" fill="#fff" font-size="22">OFF</text><text x="125" y="262" fill="#8eb0a4" font-size="17">reset não retoma saída</text></g></g><text x="600" y="476" text-anchor="middle" fill="#ffc866" font-family="sans-serif" font-size="18">Primeiro use cargas simuladas · hardware real continua HOLD até ensaio elétrico</text></svg>
