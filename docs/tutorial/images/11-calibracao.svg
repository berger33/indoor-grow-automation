<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Quatro grupos de calibração</title><desc id="desc">Massa, bombas, pH e EC com referência e verificação.</desc><rect width="1200" height="520" fill="#071411"/><text x="55" y="55" fill="#52e6a3" font-family="sans-serif" font-size="25" font-weight="700">ETAPA 11 · REFERÊNCIA → MEDIÇÃO → COEFICIENTE → VERIFICAÇÃO</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(60 110)"><rect width="250" height="290" rx="18" fill="#10261f" stroke="#1d3a31"/><text x="125" y="42" fill="#fff" font-size="21">Massa</text><path d="M75 195h100l-15 40H90z" fill="#62d9df"/><rect x="95" y="105" width="60" height="85" rx="8" fill="#ffc866"/><text x="125" y="262" fill="#8eb0a4" font-size="17">tara + peso certificado</text></g><g transform="translate(340 110)"><rect width="250" height="290" rx="18" fill="#10261f" stroke="#1d3a31"/><text x="125" y="42" fill="#fff" font-size="21">Bombas</text><path d="M125 88c-30 48-45 69-45 98a45 45 0 0090 0c0-29-15-50-45-98z" fill="#58a6ff"/><text x="125" y="262" fill="#8eb0a4" font-size="17">5/10/15 s · proveta</text></g><g transform="translate(620 110)"><rect width="250" height="290" rx="18" fill="#10261f" stroke="#1d3a31"/><text x="125" y="42" fill="#fff" font-size="21">pH</text><circle cx="125" cy="160" r="70" fill="#b999ff"/><text x="125" y="170" fill="#071411" font-size="30" font-weight="700">4 · 7 · 10</text><text x="125" y="262" fill="#8eb0a4" font-size="17">ACK Atlas por ponto</text></g><g transform="translate(900 110)"><rect width="250" height="290" rx="18" fill="#10261f" stroke="#1d3a31"/><text x="125" y="42" fill="#fff" font-size="21">EC</text><path d="M70 200c25-80 85-80 110 0" fill="none" stroke="#52e6a3" stroke-width="10"/><path d="M125 200l37-55" stroke="#ffc866" stroke-width="7"/><text x="125" y="262" fill="#8eb0a4" font-size="17">padrão + temperatura + ACK</text></g></g><text x="600" y="476" text-anchor="middle" fill="#ffc866" font-family="sans-serif" font-size="18">Nunca registre “aprovado” sem repetir a referência e guardar a evidência</text></svg>
