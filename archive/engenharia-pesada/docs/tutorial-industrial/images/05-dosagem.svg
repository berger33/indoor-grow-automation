<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Linhas das seis dosadoras</title><desc id="desc">Identificação, sucção, bomba e descarga sem cruzamento.</desc><rect width="1200" height="520" fill="#071411"/><text x="55" y="55" fill="#52e6a3" font-family="sans-serif" font-size="25" font-weight="700">ETAPA 05 · SEIS LINHAS INDEPENDENTES</text><g font-family="sans-serif"><g transform="translate(60 105)"><rect width="260" height="310" rx="18" fill="#10261f" stroke="#1d3a31"/><text x="130" y="42" text-anchor="middle" fill="#fff" font-size="21">1 · Frascos C1–C6</text><g fill="#164c48" stroke="#62d9df" stroke-width="3"><path d="M35 145h45l8 110H27z"/><path d="M105 145h45l8 110H97z"/><path d="M175 145h45l8 110h-61z"/></g><text x="130" y="285" text-anchor="middle" fill="#8eb0a4" font-size="17">rótulo + lote + validade</text></g><g transform="translate(365 105)"><rect width="210" height="310" rx="18" fill="#10261f" stroke="#1d3a31"/><text x="105" y="42" text-anchor="middle" fill="#fff" font-size="21">2 · Sucção</text><path d="M60 95v145h90V95" fill="none" stroke="#62d9df" stroke-width="9"/><circle cx="60" cy="240" r="15" fill="#ffc866"/><text x="105" y="285" text-anchor="middle" fill="#8eb0a4" font-size="17">sem sifão e sem bolha</text></g><g transform="translate(620 105)"><rect width="210" height="310" rx="18" fill="#10261f" stroke="#1d3a31"/><text x="105" y="42" text-anchor="middle" fill="#fff" font-size="21">3 · Peristáltica</text><circle cx="105" cy="170" r="65" fill="#164c48" stroke="#52e6a3" stroke-width="6"/><circle cx="80" cy="145" r="13" fill="#ffc866"/><circle cx="130" cy="195" r="13" fill="#ffc866"/><text x="105" y="285" text-anchor="middle" fill="#8eb0a4" font-size="17">cabeçote acessível</text></g><g transform="translate(875 105)"><rect width="260" height="310" rx="18" fill="#10261f" stroke="#1d3a31"/><text x="130" y="42" text-anchor="middle" fill="#fff" font-size="21">4 · Descarga</text><path d="M45 110c80 0 50 130 130 130" fill="none" stroke="#62d9df" stroke-width="9"/><path d="M165 218l35 22-35 22z" fill="#52e6a3"/><text x="130" y="285" text-anchor="middle" fill="#8eb0a4" font-size="17">acima do líquido · anti-retorno</text></g></g><text x="600" y="477" text-anchor="middle" fill="#ffc866" font-family="sans-serif" font-size="18">Nunca compartilhe mangueira entre concentrados · pH+ e pH− permanecem separados</text></svg>
