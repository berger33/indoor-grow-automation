<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Montagem hidráulica em quatro passos</title><desc id="desc">Corte, válvula, bomba e ensaio de estanqueidade.</desc><rect width="1200" height="520" fill="#071411"/><text x="60" y="55" fill="#52e6a3" font-family="sans-serif" font-size="25" font-weight="700">ETAPA 04 · CIRCUITO SEM ENERGIA A0/HOLD</text><g font-family="sans-serif" text-anchor="middle" fill="#fff"><g transform="translate(60 110)"><rect width="240" height="290" rx="18" fill="#10261f" stroke="#1d3a31"/><text x="120" y="42" font-size="21">1 · Medir e cortar</text><path d="M45 175h150" stroke="#62d9df" stroke-width="18"/><path d="M105 135l30 80M135 135l-30 80" stroke="#ffc866" stroke-width="6"/><text x="120" y="260" fill="#8eb0a4" font-size="17">corte reto · sem rebarba</text></g><g transform="translate(340 110)"><rect width="240" height="290" rx="18" fill="#10261f" stroke="#1d3a31"/><text x="120" y="42" font-size="21">2 · Sentido</text><path d="M35 175h170" stroke="#62d9df" stroke-width="18"/><path d="M96 135l50 40-50 40z" fill="#52e6a3"/><text x="120" y="260" fill="#8eb0a4" font-size="17">setas e etiquetas visíveis</text></g><g transform="translate(620 110)"><rect width="240" height="290" rx="18" fill="#10261f" stroke="#1d3a31"/><text x="120" y="42" font-size="21">3 · Apoiar</text><circle cx="120" cy="172" r="58" fill="#164c48" stroke="#62d9df" stroke-width="6"/><path d="M25 172h37M178 172h37" stroke="#62d9df" stroke-width="18"/><text x="120" y="260" fill="#8eb0a4" font-size="17">peso fora das conexões</text></g><g transform="translate(900 110)"><rect width="240" height="290" rx="18" fill="#10261f" stroke="#1d3a31"/><text x="120" y="42" font-size="21">4 · Água</text><path d="M120 95c-32 52-51 75-51 108a51 51 0 00102 0c0-33-19-56-51-108z" fill="#58a6ff"/><text x="120" y="260" fill="#8eb0a4" font-size="17">30 min · papel seco</text></g></g><text x="600" y="475" text-anchor="middle" fill="#ffc866" font-family="sans-serif" font-size="18">Teste somente com água · eletrônica desconectada · descarte conforme o fluido real</text></svg>
