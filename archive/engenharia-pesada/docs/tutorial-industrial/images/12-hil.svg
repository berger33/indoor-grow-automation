<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Escada de testes HIL</title><desc id="desc">Virtual, carga simulada, água e falhas.</desc><rect width="1200" height="520" fill="#071411"/><text x="55" y="55" fill="#52e6a3" font-family="sans-serif" font-size="25" font-weight="700">ETAPA 12 · SUBIR UM GATE POR VEZ</text><g font-family="sans-serif"><path d="M90 390h230v-80h230v-80h230v-80h230" fill="none" stroke="#52e6a3" stroke-width="12"/><g fill="#fff" font-size="21" text-anchor="middle"><text x="205" y="360">1 · Virtual</text><text x="435" y="280">2 · Carga simulada</text><text x="665" y="200">3 · Água</text><text x="895" y="120">4 · Falhas reais</text></g><g fill="#8eb0a4" font-size="16" text-anchor="middle"><text x="205" y="420">sensor · rede · reset · timeout</text><text x="435" y="340">LED/relé sem carga</text><text x="665" y="260">estanqueidade e vazão</text><text x="895" y="180">desconectar e comprovar OFF</text></g><circle cx="90" cy="390" r="18" fill="#ffc866"/><circle cx="1010" cy="150" r="18" fill="#62d9df"/></g><text x="600" y="476" text-anchor="middle" fill="#ffc866" font-family="sans-serif" font-size="18">Qualquer falha retorna ao degrau anterior · químico só depois do piloto com água aprovado</text></svg>
