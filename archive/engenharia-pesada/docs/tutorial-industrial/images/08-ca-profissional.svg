<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Fluxo exclusivo do profissional para corrente alternada</title><desc id="desc">Bloqueio, montagem, ensaios e liberação formal.</desc><rect width="1200" height="520" fill="#071411"/><text x="55" y="55" fill="#ff7a7a" font-family="sans-serif" font-size="25" font-weight="700">ETAPA 08 · 127 V/60 Hz · EXCLUSIVA DE PROFISSIONAL HABILITADO</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(60 110)"><rect width="250" height="290" rx="18" fill="#241515" stroke="#ff7a7a"/><text x="125" y="42" fill="#fff" font-size="21">1 · Bloquear</text><rect x="88" y="105" width="74" height="110" rx="10" fill="#ff7a7a"/><path d="M103 105V78a22 22 0 0144 0v27" fill="none" stroke="#ffc866" stroke-width="9"/><text x="125" y="262" fill="#ffc1c1" font-size="17">seccionar e comprovar ausência</text></g><g transform="translate(340 110)"><rect width="250" height="290" rx="18" fill="#241515" stroke="#ff7a7a"/><text x="125" y="42" fill="#fff" font-size="21">2 · Montar</text><path d="M60 95v130M125 95v130M190 95v130" stroke-width="14"/><path d="M60 95v130" stroke="#9b6b3e" stroke-width="14"/><path d="M125 95v130" stroke="#62d9df" stroke-width="14"/><path d="M190 95v130" stroke="#52e6a3" stroke-width="14"/><text x="125" y="262" fill="#ffc1c1" font-size="17">L · N · PE segregados</text></g><g transform="translate(620 110)"><rect width="250" height="290" rx="18" fill="#241515" stroke="#ff7a7a"/><text x="125" y="42" fill="#fff" font-size="21">3 · Ensaiar</text><circle cx="125" cy="160" r="64" fill="#301b1b" stroke="#ffc866" stroke-width="7"/><path d="M125 160l38-36" stroke="#ff7a7a" stroke-width="7"/><text x="125" y="262" fill="#ffc1c1" font-size="17">PE · isolação · DR · torque</text></g><g transform="translate(900 110)"><rect width="250" height="290" rx="18" fill="#241515" stroke="#ff7a7a"/><text x="125" y="42" fill="#fff" font-si