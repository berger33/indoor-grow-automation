<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Fluxo supervisionado da primeira batelada</title><desc id="desc">Checklist, água, nutrientes, correções e liberação.</desc><rect width="1200" height="520" fill="#071411"/><text x="55" y="55" fill="#52e6a3" font-family="sans-serif" font-size="25" font-weight="700">ETAPA 13 · PRIMEIRA BATELADA SUPERVISIONADA</text><g font-family="sans-serif" text-anchor="middle" font-size="19"><g fill="#10261f" stroke="#52e6a3" stroke-width="3"><rect x="45" y="150" width="175" height="110" rx="16"/><rect x="275" y="150" width="175" height="110" rx="16"/><rect x="505" y="150" width="175" height="110" rx="16"/><rect x="735" y="150" width="175" height="110" rx="16"/><rect x="965" y="150" width="190" height="110" rx="16"/></g><g fill="#fff"><text x="132" y="197">1 · Checklist</text><text x="132" y="228">e comando</text><text x="362" y="197">2 · Encher</text><text x="362" y="228">com água</text><text x="592" y="197">3 · Nutrientes</text><text x="592" y="228">+ mistura</text><text x="822" y="197">4 · EC e pH</text><text x="822" y="228">com espera</text><text x="1060" y="197">5 · Liberar</text><text x="1060" y="228">ou abortar</text></g><g stroke="#62d9df" stroke-width="8"><path d="M220 205h55"/><path d="M450 205h55"/><path d="M680 205h55"/><path d="M910 205h55"/></g><path d="M1060 280v80H132v-80" fill="none" stroke="#ff7a7a" stroke-width="6" stroke-dasharray="12 8"/><text x="600" y="395" fill="#ff7a7a">falha → todas as saídas OFF → registrar causa → não retomar automaticamente</text></g><text x="600" y="476" text-anchor="middle" fill="#ffc866" font-family="sans-serif" font-size="18">Metas dependem do cultivo e dos fabricantes · não existe receita química universal</text></svg>
