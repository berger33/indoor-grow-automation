<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Sequência dos tanques e plataformas</title><desc id="desc">Quatro passos: contenção, plataforma, tanque e teste de repetibilidade.</desc><rect width="1200" height="520" fill="#071411"/><text x="60" y="55" fill="#52e6a3" font-family="sans-serif" font-size="25" font-weight="700">ETAPA 03 · ILUSTRAÇÃO TÉCNICA A0/HOLD</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(55 105)"><rect width="240" height="300" rx="18" fill="#10261f" stroke="#52e6a3"/><text x="120" y="45" fill="#fff" font-size="22">1 · Contenção</text><path d="M42 210h156v42H42z" fill="none" stroke="#62d9df" stroke-width="8"/><text x="120" y="280" fill="#8eb0a4" font-size="17">seca e nivelada</text></g><g transform="translate(335 105)"><rect width="240" height="300" rx="18" fill="#10261f" stroke="#52e6a3"/><text x="120" y="45" fill="#fff" font-size="22">2 · Plataforma</text><rect x="45" y="192" width="150" height="24" rx="6" fill="#62d9df"/><circle cx="65" cy="238" r="12" fill="#ffc866"/><circle cx="175" cy="238" r="12" fill="#ffc866"/><text x="120" y="280" fill="#8eb0a4" font-size="17">sem carga lateral</text></g><g transform="translate(615 105)"><rect width="240" height="300" rx="18" fill="#10261f" stroke="#52e6a3"/><text x="120" y="45" fill="#fff" font-size="22">3 · Tanque</text><path d="M60 100h120l-12 150H72z" fill="#164c48" stroke="#62d9df" stroke-width="4"/><path d="M74 190h92" stroke="#58a6ff" stroke-width="38"/><text x="120" y="280" fill="#8eb0a4" font-size="17">folga em toda volta</text></g><g transform="translate(895 105)"><rect width="240" height="300" rx="18" fill="#10261f" stroke="#52e6a3"/><text x="120" y="45" fill="#fff" font-size="22">4 · Verificação</text><path d="M52 208l38 38 92-110" fill="none" stroke="#52e6a3" stroke-width="12"/><text x="120" y="280" fill="#8eb0a4" font-size="17">tara × 5 e batentes</text></g></g><text x="600" y="480" text-anchor="middle" fill="#ffc866" font-family="sans-serif" font-size="18">Não representa dimensões as-built · medir o hardware real antes de furar ou comprar</text></svg>
