<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><style>
text{font-family:Arial,sans-serif;fill:#d8f3ff}.t{font-size:34px;font-weight:bold}.h{font-size:22px;font-weight:bold}.n{font-size:17px}.s{font-size:14px}.box{fill:#071824;stroke:#39c5ff;stroke-width:3}.sub{fill:#0a2634;stroke:#1b8fb8;stroke-width:2}.sig{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}.pwr{stroke:#ff6b6b;stroke-width:4;fill:none;marker-end:url(#r)}.io{stroke:#4dd599;stroke-width:3;fill:none;marker-end:url(#g)}.dash{stroke-dasharray:12 8}.dim{fill:#89a9b8;font-size:14px}.title{fill:#06131c;stroke:#39c5ff;stroke-width:3}
</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#ffd166"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#ff6b6b"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#4dd599"/></marker></defs>
<rect width="1600" height="1000" fill="#020b11"/><rect x="25" y="25" width="1550" height="950" class="title"/>
<text x="55" y="75" class="t">PRANCHA 01 — ARQUITETURA FUNCIONAL CONSOLIDADA</text><text x="55" y="105" class="dim">Referência observada: Home Assistant + MQTT + ESP32 + Arduino Mega / estação PCB v2</text>
<rect x="70" y="150" width="320" height="180" rx="10" class="box"/><text x="95" y="190" class="h">SERVIDOR LOCAL</text><text x="95" y="225" class="n">Home Assistant</text><text x="95" y="252" class="n">Mosquitto MQTT</text><text x="95" y="279" class="n">MariaDB / Recorder</text><text x="95" y="306" class="s">Raspberry Pi 4 ou PC Linux</text>
<rect x="70" y="420" width="320" height="150" rx="10" class="box"/><text x="95" y="460" class="h">INTERFACES</text><text x="95" y="495" class="n">Tablet Fire HD 8</text><text x="95" y="522" class="n">Navegador desktop / telefone</text><text x="95" y="548" class="s">Painel Lovelace responsivo</text>
<path d="M230 420V330" class="sig"/><text x="245" y="382" class="s">LAN / HTTP</text>
<rect x="550" y="145" width="420" height="235" rx="10" class="box"/><text x="575" y="185" class="h">GABINETE CENTRAL — V1</text><rect x="580" y="210" width="160" height="120" class="sub"/><text x="600" y="242" class="n">ESP32</text><text x="600" y="269" class="s">Wi-Fi + MQTT</text><text x="600" y="294" class="s">Atlas + bombas</text><rect x="780" y="210" width="160" height="120" class="sub"/><text x="800" y="242" class="n">Arduino Mega</text><text x="800" y="269" class="s">I/O + relés</text><text x="800" y="294" class="s">HX711/flood</text><path d="M740 270H780" class="sig"/><text x="742" y="252" class="s">UART</text>
<path d="M390 240H550" class="sig dash"/><text x="420" y="225" class="s">Wi-Fi / MQTT</text>
<rect x="550" y="465" width="420" height="180" rx="10" class="box"/><text x="575" y="505" class="h">ESTAÇÃO DE TENDA — V2</text><text x="575" y="540" class="n">ESP32 38 pinos + PCB própria</text><text x="575" y="570" class="n">L298N + Atlas isolado + 12→5 V</text><text x="575" y="600" class="n">I/O clima, nível, luz e exaustor</text><text x="575" y="627" class="s">Caixa impressa: 167 × 194 × 90 mm</text><path d="M390 270C470 270 470 545 550 545" class="sig dash"/>
<rect x="1110" y="135" width="400" height="220" rx="10" class="box"/><text x="1135" y="175" class="h">SENSORES</text><text x="1135" y="210" class="n">pH • EC • DS18B20</text><text x="1135" y="242" class="n">2× BME280 • MLX90614</text><text x="1135" y="274" class="n">HX711 + 4 células de carga</text><text x="1135" y="306" class="n">4× vazamento • boia • ultrassônico</text><text x="1135" y="335" class="s">CO₂ e vazão não foram observados</text>
<rect x="1110" y="430" width="400" height="300" rx="10" class="box"/><text x="1135" y="470" class="h">ATUADORES</text><text x="1135" y="505" class="n">6× bombas peristálticas</text><text x="1135" y="537" class="n">4× bombas submersíveis</text><text x="1135" y="569" class="n">2× válvulas solenoides</text><text x="1135" y="601" class="n">6× agitadores magnéticos</text><text x="1135" y="633" class="n">Exaustor PWM • luz PWM</text><text x="1135" y="665" class="n">Umidificador DIY • relés • tomadas Wi-Fi</text><text x="1135" y="704" class="s">Cargas CA isoladas da lógica de baixa tensão</text>
<path d="M970 255H1110" class="io"/><path d="M970 555H1110" class="io"/><text x="1000" y="235" class="s">aquisição</text><text x="1000" y="535" class="s">comandos</text>
<rect x="70" y="790" width="1440" height="120" class="sub"/><text x="95" y="827" class="h">LEGENDA / LIMITES</text><line x1="95" y1="858" x2="165" y2="858" class="sig"/><text x="180" y="864" class="n">dados</text><line x1="300" y1="858" x2="370" y2="858" class="io"/><text x="385" y="864" class="n">I/O de campo</text><line x1="560" y1="858" x2="630" y2="858" class="pwr"/><text x="645" y="864" class="n">potência</text><text x="790" y="864" class="n">V1 e V2 são gerações diferentes; não montar ambas sem redefinir a arquitetura.</text><text x="95" y="895" class="s">Desenho funcional, não executivo. Confirmar pinagem, corrente, proteção e compatibilidade antes da fabricação.</text>
