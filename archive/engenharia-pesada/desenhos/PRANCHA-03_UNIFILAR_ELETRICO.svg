<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
<defs><style>text{font-family:Arial,sans-serif;fill:#d9f4ff}.t{font-size:34px;font-weight:bold}.h{font-size:20px;font-weight:bold}.n{font-size:16px}.s{font-size:13px}.box{fill:#071c29;stroke:#39c5ff;stroke-width:3}.obs{fill:#10293a;stroke:#4dd599;stroke-width:3}.rec{fill:#2b1b0a;stroke:#ffb84d;stroke-width:3}.ac{stroke:#ff6b6b;stroke-width:5;fill:none}.dc{stroke:#4dd599;stroke-width:5;fill:none}.sig{stroke:#ffd166;stroke-width:3;fill:none;stroke-dasharray:9 7}.title{fill:#04121c;stroke:#39c5ff;stroke-width:3}</style><marker id="x" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#ff6b6b"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#4dd599"/></marker></defs>
<rect width="1800" height="1100" fill="#020b11"/><rect x="25" y="25" width="1750" height="1050" class="title"/><text x="55" y="75" class="t">PRANCHA 03 — DIAGRAMA UNIFILAR / SEGREGAÇÃO ELÉTRICA</text><text x="55" y="105" class="s">Verde = observado • âmbar = proteção recomendada para projeto novo • vermelho = rede CA</text>
<rect x="60" y="175" width="210" height="100" class="obs"/><text x="85" y="215" class="h">ENTRADA CA</text><text x="85" y="245" class="n">IEC C14</text><path d="M270 225H355" class="ac" marker-end="url(#x)"/>
<rect x="355" y="160" width="250" height="130" class="rec"/><text x="380" y="200" class="h">PROTEÇÕES*</text><text x="380" y="232" class="n">fusível/disjuntor + DR/GFCI</text><text x="380" y="260" class="s">*não demonstradas claramente</text><path d="M605 225H690" class="ac" marker-end="url(#x)"/>
<rect x="690" y="150" width="280" height="150" class="obs"/><text x="720" y="190" class="h">FONTE CC</text><text x="720" y="225" class="n">V1: Mean Well 12 V / 150 W</text><text x="720" y="255" class="n">V2: 12 V / 50 W</text><path d="M830 300V405" class="dc" marker-end="url(#g)"/>
<rect x="650" y="405" width="360" height="165" class="obs"/><text x="680" y="445" class="h">BARRAMENTO 12 VCC</text><text x="680" y="480" class="n">V1: buck 7 V + buck 5 V</text><text x="680" y="510" class="n">V2: VX7805-1000 (12→5 V)</text><text x="680" y="540" class="s">retorno 0 V comum onde aplicável</text>
<rect x="80" y="395" width="390" height="195" class="obs"/><text x="110" y="435" class="h">LÓGICA / AQUISIÇÃO</text><text x="110" y="470" class="n">ESP32 38 pinos</text><text x="110" y="500" class="n">Arduino Mega + Tentacle Shield (V1)</text><text x="110" y="530" class="n">Atlas EZO isolado • HX711 • sensores</text><text x="110" y="560" class="s">alimentação SELV; cabos de sinal segregados</text><path d="M650 490H470" class="dc" marker-end="url(#g)"/>
<rect x="1120" y="370" width="580" height="250" class="obs"/><text x="1150" y="410" class="h">ACIONAMENTOS 12 VCC / SINAL</text><text x="1150" y="450" class="n">3× L298N → 6 bombas peristálticas (V1)</text><text x="1150" y="480" class="n">1× L298N → pH− / pH+ (V2)</text><text x="1150" y="510" class="n">IRLZ44N / nível 0–10 V → exaustor</text><text x="1150" y="540" class="n">PC817 → 2 saídas de dimerização de luz</text><text x="1150" y="570" class="n">relés 8 canais + 4 canais → bombas/válvulas</text><path d="M1010 490H1120" class="dc" marker-end="url(#g)"/>
<rect x="80" y="715" width="510" height="220" class="obs"/><text x="110" y="755" class="h">CARGAS CA COMUTADAS</text><text x="110" y="795" class="n">luminária de cultivo</text><text x="110" y="825" class="n">umidificador / tomadas auxiliares</text><text x="110" y="855" class="n">TP-Link HS105 (V1) / régua Tuya (V2)</text><text x="110" y="890" class="s">contator/relé deve ser dimensionado pela carga</text><path d="M480 290V715" class="ac" marker-end="url(#x)"/>
<rect x="710" y="715" width="420" height="220" class="rec"/><text x="740" y="755" class="h">RECOMENDAÇÕES DE EXECUÇÃO</text><text x="740" y="795" class="n">• fusível por ramal e borne PE</text><text x="740" y="825" class="n">• prensa-cabos e alívio de tração</text><text x="740" y="855" class="n">• separação física CA / SELV</text><text x="740" y="885" class="n">• gabinete IP adequado + gotejamento</text><text x="740" y="915" class="s">validar corrente de partida e dissipação</text>
<rect x="1240" y="715" width="460" height="220" class="rec"/><text x="1270" y="755" class="h">ESTADO SEGURO</text><text x="1270" y="795" class="n">desenergizar bombas de transferência/dosagem</text><text x="1270" y="825" class="n">fechar água de entrada</text><text x="1270" y="855" class="n">preservar ventilação apenas se não ampliar risco</text><text x="1270" y="885" class="n">alarme local independente da rede</text><text x="1270" y="915" class="s">projeto novo: contato físico de emergência</text>
<path d="M470 590C700 650 1010 650 1260 620" class="sig"/><text x="700" y="670" class="s">comandos PWM / relé / intertravamentos</text><text x="60" y="1025" class="n" fill="#ffca6b">Rede CA próxima de água exige profissional habilitado, aterramento, DR/GFCI e conformidade às normas locais.</text>
</svg>

